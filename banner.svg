<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <radialGradient id="glow" cx="82%" cy="20%" r="60%">
      <stop offset="0" stop-color="#FF521C" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FF521C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="o" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB347"/><stop offset=".5" stop-color="#FF521C"/><stop offset="1" stop-color="#E0380C"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <style>
      .k{font:700 13px Inter,Segoe UI,Helvetica,Arial,sans-serif;letter-spacing:5px;fill:#FF521C}
      .h{font:800 64px Inter,Segoe UI,Helvetica,Arial,sans-serif;fill:#fff;letter-spacing:-2px}
      .s{font:500 21px Inter,Segoe UI,Helvetica,Arial,sans-serif;fill:#B9B9BF}
      .t{font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#fff}
      .streak{animation:fly 2.4s ease-in-out infinite}
      .d2{animation-delay:.3s}.d3{animation-delay:.6s}
      @keyframes fly{0%{transform:translateX(-30px);opacity:0}30%{opacity:1}100%{transform:translateX(40px);opacity:0}}
      .cur{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>
  <rect width="1280" height="320" rx="18" fill="#0B0B0C"/>
  <rect width="1280" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="320" rx="18" fill="url(#glow)"/>
  <text x="64" y="92" class="k">GROWTH · AUTOMATION · AI AGENTS</text>
  <text x="64" y="168" class="h">Hey, I'm Clay<tspan fill="#FF521C">.</tspan></text>
  <text x="64" y="212" class="s">Founding growth &amp; automation engineer at HouseJet.</text>
  <text x="64" y="244" class="s">I build ads, funnels and AI systems that run on their own.</text>
  <rect x="64" y="268" width="300" height="3" rx="1.5" fill="url(#o)"/>
  <!-- C mark -->
  <g transform="translate(1035 160)">
    <path d="M70 -72 A102 102 0 1 0 70 72" fill="none" stroke="url(#o)" stroke-width="40" stroke-linecap="round"/>
    <circle cx="-26" cy="0" r="15" fill="#fff"/>
    <path class="streak" d="M52 0H140" stroke="#fff" stroke-width="13" stroke-linecap="round"/>
    <path class="streak d2" d="M80 -28H130" stroke="#fff" stroke-opacity=".55" stroke-width="8" stroke-linecap="round"/>
    <path class="streak d3" d="M80 28H130" stroke="#fff" stroke-opacity=".55" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="840" y="296" class="t">&gt; shipping<tspan class="cur" fill="#FF521C">_</tspan></text>
</svg>
